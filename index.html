<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRM Leads Manager</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
      background: #f4f4f4;
    }

    h2 {
      text-align: center;
    }

    form {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    input, select {
      padding: 10px;
    }

    button {
      padding: 10px 15px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    .delete {
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>CRM Lead Manager</h2>

<form id="leadForm">
  <input type="text" id="name" placeholder="Name" required>
  <input type="email" id="email" placeholder="Email" required>
  <select id="source" required>
    <option value="">Source</option>
    <option value="Instagram">Instagram</option>
    <option value="Website">Website</option>
    <option value="Referral">Referral</option>
  </select>
  <button type="submit">Add Lead</button>
</form>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Source</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="leadTable"></tbody>
</table>

<script>
const leadForm = document.getElementById("leadForm");
const leadTable = document.getElementById("leadTable");

// ✅ SAFE LOAD (DO NOT overwrite storage)
function getLeads() {
  try {
    const data = localStorage.getItem("leads");
    return data ? JSON.parse(data) : [];
  } catch (e) {
    console.log("Storage error:", e);
    return [];
  }
}

let leads = getLeads();

// Render table
function displayLeads() {
  leadTable.innerHTML = "";

  leads.forEach((lead, index) => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${lead.name}</td>
      <td>${lead.email}</td>
      <td>${lead.source}</td>
      <td><button class="delete" onclick="deleteLead(${index})">Delete</button></td>
    `;

    leadTable.appendChild(row);
  });

  // ONLY read, NEVER reset storage here ❌
}

// Add lead
leadForm.addEventListener("submit", function(e) {
  e.preventDefault();

  const newLead = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    source: document.getElementById("source").value
  };

  leads.push(newLead);

  // ✅ Save ONLY when data changes
  localStorage.setItem("leads", JSON.stringify(leads));

  leadForm.reset();
  displayLeads();
});

// Delete lead
function deleteLead(index) {
  leads.splice(index, 1);

  // update storage
  localStorage.setItem("leads", JSON.stringify(leads));

  displayLeads();
}

// initial render
displayLeads();
</script>

</body>
</html>
