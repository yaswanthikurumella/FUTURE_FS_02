<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Lead Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6fb;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:250px;
background:linear-gradient(180deg,#0f172a,#1e3a8a);
color:white;
padding:30px 20px;
}

.logo h2{
margin-bottom:8px;
}

.logo p{
font-size:13px;
opacity:.8;
}

.sidebar ul{
list-style:none;
margin-top:40px;
}

.sidebar ul li{
padding:15px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
}

.sidebar ul li:hover{
background:rgba(255,255,255,.15);
}

.main{
flex:1;
padding:30px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card p{
font-size:30px;
font-weight:bold;
color:#4f46e5;
}

.form-section{
background:white;
padding:25px;
border-radius:18px;
margin-bottom:30px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

form{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

input,select,textarea{
padding:12px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

button{
background:linear-gradient(90deg,#4f46e5,#7c3aed);
color:white;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.table-container{
background:white;
padding:20px;
border-radius:18px;
overflow-x:auto;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#4f46e5;
color:white;
padding:12px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #eee;
}

td button{
background:#ef4444;
padding:6px 10px;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">
<h2>CRM Panel</h2>
<p>Lead Management</p>
</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div class="dashboard">
<div class="card">
<h3>Total Leads</h3>
<p id="totalLeads">0</p>
</div>

<div class="card">
<h3>New</h3>
<p id="newLeads">0</p>
</div>

<div class="card">
<h3>Contacted</h3>
<p id="contactedLeads">0</p>
</div>

<div class="card">
<h3>Converted</h3>
<p id="convertedLeads">0</p>
</div>
</div>

<!-- FORM -->
<div class="form-section">
<h2>Add Lead</h2>

<form id="leadForm">
<input id="name" placeholder="Name" required>
<input id="email" placeholder="Email" required>
<input id="source" placeholder="Source" required>

<select id="status">
<option>New</option>
<option>Contacted</option>
<option>Converted</option>
</select>

<textarea id="notes" placeholder="Notes"></textarea>

<button type="submit">Add Lead</button>
</form>
</div>

<!-- TABLE -->
<div class="table-container">
<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Source</th>
<th>Status</th>
<th>Notes</th>
<th>Action</th>
</tr>
</thead>
<tbody id="leadTable"></tbody>
</table>
</div>

</div>
</div>

<script>
// ===============================
// INIT STORAGE
// ===============================
let leads = JSON.parse(localStorage.getItem("leads")) || [];

const leadForm = document.getElementById("leadForm");
const leadTable = document.getElementById("leadTable");

// ===============================
// SAVE
// ===============================
function saveLeads(){
localStorage.setItem("leads", JSON.stringify(leads));
render();
}

// ===============================
// ADD
// ===============================
leadForm.addEventListener("submit", function(e){
e.preventDefault();

const lead = {
name: name.value,
email: email.value,
source: source.value,
status: status.value,
notes: notes.value
};

leads.push(lead);
leadForm.reset();
saveLeads();
});

// ===============================
// DELETE
// ===============================
function deleteLead(i){
leads.splice(i,1);
saveLeads();
}

// ===============================
// RENDER
// ===============================
function render(){

leadTable.innerHTML = "";

let total = leads.length;
let n=0,c=0,cv=0;

leads.forEach((l,i)=>{

if(l.status==="New") n++;
if(l.status==="Contacted") c++;
if(l.status==="Converted") cv++;

leadTable.innerHTML += `
<tr>
<td>${l.name}</td>
<td>${l.email}</td>
<td>${l.source}</td>
<td>${l.status}</td>
<td>${l.notes}</td>
<td><button onclick="deleteLead(${i})">Delete</button></td>
</tr>
`;
});

totalLeads.textContent = total;
newLeads.textContent = n;
contactedLeads.textContent = c;
convertedLeads.textContent = cv;
}

render();
</script>

</body>
</html>
