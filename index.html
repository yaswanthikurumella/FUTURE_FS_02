<script>
function getLeads() {
    try {
        const data = localStorage.getItem("leads");
        return data ? JSON.parse(data) : [];
    } catch (e) {
        console.log("Storage error:", e);
        return [];
    }
}

let leads = getLeads();

const leadForm = document.getElementById("leadForm");
const leadTable = document.getElementById("leadTable");

// prevent accidental double rendering issues
let isRendered = false;

// ===== RENDER =====
function renderLeads() {
    if (!leadTable) return;

    leadTable.innerHTML = "";

    leads.forEach((lead, index) => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${lead.name}</td>
            <td>${lead.email}</td>
            <td>${lead.source}</td>
            <td>${lead.status}</td>
            <td>${lead.notes}</td>
            <td>
                <button onclick="deleteLead(${index})">Delete</button>
            </td>
        `;

        leadTable.appendChild(row);
    });

    updateDashboard();
}

// ===== ADD LEAD =====
leadForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const newLead = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        source: document.getElementById("source").value,
        status: document.getElementById("status").value,
        notes: document.getElementById("notes").value
    };

    leads.push(newLead);

    // IMPORTANT: ONLY update storage here
    localStorage.setItem("leads", JSON.stringify(leads));

    leadForm.reset();
    renderLeads();
});

// ===== DELETE LEAD =====
function deleteLead(index) {
    leads.splice(index, 1);

    localStorage.setItem("leads", JSON.stringify(leads));

    renderLeads();
}

// ===== DASHBOARD =====
function updateDashboard() {
    document.getElementById("totalLeads").innerText = leads.length;

    document.getElementById("newLeads").innerText =
        leads.filter(l => l.status === "New").length;

    document.getElementById("contactedLeads").innerText =
        leads.filter(l => l.status === "Contacted").length;

    document.getElementById("convertedLeads").innerText =
        leads.filter(l => l.status === "Converted").length;
}

// ===== INIT ONLY ONCE =====
if (!isRendered) {
    renderLeads();
    isRendered = true;
}
</script>
